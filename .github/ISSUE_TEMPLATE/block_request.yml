name: IP block request
description: Report a malicious IP address for inclusion in the blocklist.
title: "[BLOCK] : <IP_ADDRESS>"
labels: ["Block Request", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Malicious IP report
        Please complete this form accurately to help us review your report.

  - type: input
    id: ip_address
    attributes:
      label: Target IP address
      description: The IPv4 address covered by this report.
      placeholder: "e.g. 192.168.1.1"
    validations:
      required: true

  - type: dropdown
    id: attack_type
    attributes:
      label: Attack type
      description: Select the main category of malicious activity.
      options:
        - SSH Brute Force
        - Web Scanner / Crawler (e.g. WP Scan)
        - DDoS / DoS / Flood
        - Exploit Attempt (RCE, SQLi, XSS)
        - Email Spam / Relay Abuse
        - Port Scanning
        - Botnet Activity
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Evidence / logs (required)
      description: |
        Paste log excerpts (firewall, Nginx, auth.log, Fail2Ban) that provide evidence of the attack.
        Use code blocks for readability.
      placeholder: |
        Jan 27 10:00:00 server sshd[12345]: Failed password for invalid user admin from x.x.x.x port 54321 ssh2
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why should this IP be blocked? (Context)
      description: Briefly describe the observed behavior or attack frequency.
      placeholder: "This IP attempted 500 SSH connections in less than one minute..."
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I confirm that these logs are authentic.
          required: true
        - label: Where possible, I checked that this is not a false positive, such as Googlebot or another legitimate IP address.
          required: false
