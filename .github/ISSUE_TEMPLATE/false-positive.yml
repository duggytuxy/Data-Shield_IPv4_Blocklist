name: "False-positive report"
description: "Report a blocklisted IP address that you believe is legitimate or non-malicious."
title: "[FALSE-POSITIVE] {ip} - {context}"
labels: ["false-positive","triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Summary
        Please complete this form to report a **false positive**. Provide as much evidence as possible (anonymized logs, ASN, reverse DNS, screenshots). Do not attach personal information that has not been anonymized.

  - type: input
    id: ip
    attributes:
      label: "Affected IP address"
      description: "Example: 203.0.113.45"
      placeholder: "203.0.113.45"
    validations:
      required: true

  - type: input
    id: file_list
    attributes:
      label: "File / list"
      description: "Example: prod_data-shield_ipv4_blocklist.txt"
      placeholder: "prod_data-shield_ipv4_blocklist.txt"

  - type: input
    id: observed_at
    attributes:
      label: "Date / time observed (UTC)"
      description: "Recommended format: YYYY-MM-DD HH:MM (UTC)"
      placeholder: "2025-10-06 09:12"

  - type: markdown
    attributes:
      value: |
        ---
        ## Context and evidence (provide as much detail as possible)

  - type: textarea
    id: usage_context
    attributes:
      label: "IP usage context"
      description: "Examples: an OVH-hosted web server, an Azure mail server, an enterprise appliance, or a residential router."
      placeholder: "e.g. an OVH-hosted mail server (mx.example.com)"

  - type: textarea
    id: false_positive_reason
    attributes:
      label: "Why you believe this is a false positive"
      description: "Briefly explain your reasoning, such as normal activity, a legitimate service, or an analysis error."
      placeholder: "e.g. this IP belongs to our MX server and the observed traffic is legitimate"

  - type: textarea
    id: evidence
    attributes:
      label: "Evidence (anonymized logs / excerpts)"
      description: "Paste anonymized log excerpts, UTC timestamps, and attack frequency. Include screenshots using 'Attach files' if needed."
      placeholder: "e.g. 2025-10-06T09:10:12 mail postfix/smtpd[1234]: connect from mail.example.com[203.0.113.45]"
    validations:
      required: true

  - type: input
    id: asn_isp
    attributes:
      label: "ASN / ISP (if known)"
      description: "Example: ASXXXXX - OVH SAS"
      placeholder: "ASXXXXX - OVH SAS"

  - type: input
    id: reverse_dns
    attributes:
      label: "Reverse DNS (if known)"
      description: "Example: mail.example.com"
      placeholder: "mail.example.com"

  - type: markdown
    attributes:
      value: |
        ---
        ## Additional technical details

  - type: input
    id: cidr
    attributes:
      label: "Associated CIDR range (if applicable)"
      description: "Example: 203.0.113.0/24"
      placeholder: "203.0.113.0/24"

  - type: input
    id: ports_services
    attributes:
      label: "Observed ports and services"
      description: "Example: 80 (http), 443 (https), 25 (smtp)"
      placeholder: "25 (smtp)"

  - type: input
    id: last_activity
    attributes:
      label: "Last observed activity (UTC)"
      description: "YYYY-MM-DD HH:MM"
      placeholder: "2025-10-06 09:12"

  - type: textarea
    id: impact
    attributes:
      label: "Operational impact"
      description: "Describe the impact, such as blocked access, service disruption, or affected monitoring."

  - type: markdown
    attributes:
      value: |
        ---
        ## Requested action (select all that apply)

  - type: checkboxes
    id: actions
    attributes:
      label: "Requested measures"
      options:
        - label: "Remove the IP from the blocklist immediately (urgent)"
        - label: "Quarantine / manually review before removal"
        - label: "Reclassify as whitelisted (passive monitoring)"
        - label: "Other (specify under 'Additional information')"

  - type: textarea
    id: additional_info
    attributes:
      label: "Additional information / clarification"
      description: "Use this field to explain an 'Other' selection or provide further details."

  - type: markdown
    attributes:
      value: |
        ---
        ## Privacy / important note
        - Anonymize any logs containing personal information by removing names, email addresses, and tokens.
        - For sensitive information, arrange a private channel after initial public contact on GitHub.
        - Clearly abusive reports will be documented and may result in rejection, restrictions on submissions, or a report to GitHub.

  - type: markdown
    attributes:
      value: |
        Thank you. Our team will review your request and respond within 48 hours, often sooner.
