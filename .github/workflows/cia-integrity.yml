name: CIA Triad Integrity Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '**.txt'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/cia-integrity.yml'
      - 'tests/**'

  pull_request:
    branches:
      - main
    paths:
      - '**.txt'
      - '.gitattributes'
      - '.github/scripts/**'
      - '.github/workflows/cia-integrity.yml'
      - 'tests/**'

  schedule:
    - cron: '0 3 * * *'

# Principle of least privilege (Confidentiality component)
permissions:
  contents: read

jobs:
  security-and-integrity:
    name: Validate Blocklists and Generate Hashes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Validator Tests
        run: bash tests/test_validate_and_hash.sh

      - name: Run Integrity Validation
        run: bash .github/scripts/validate_and_hash.sh --git-head

      - name: Upload Integrity Artifacts (SHA256)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blocklists-sha256sums
          path: sha256sums.txt
          if-no-files-found: error
          retention-days: 14
